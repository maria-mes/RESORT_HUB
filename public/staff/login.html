<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login - ResortHub AI</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-page">
  <div class="login-card animate-fade-in">
    <div class="login-header">
      <div class="flex items-center justify-center gap-2 mb-3">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </div>
      <h1>Staff Portal</h1>
      <p class="text-muted">Sign in to access your dashboard</p>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="label" for="email">Email Address</label>
        <input type="email" id="email" class="input" placeholder="you@resort.com" required>
      </div>

      <div class="form-group">
        <label class="label" for="password">Password</label>
        <input type="password" id="password" class="input" placeholder="Enter your password" required>
      </div>

      <div class="form-group">
        <label class="label" for="role">Login As</label>
        <select id="role" class="input" required>
          <option value="">Select your role...</option>
          <option value="admin">Administrator</option>
          <option value="manager">Manager</option>
          <option value="employee">Employee</option>
        </select>
      </div>

      <div class="flex items-center justify-between mb-4">
        <label class="flex items-center gap-2" style="cursor: pointer;">
          <input type="checkbox" id="remember">
          <span class="text-sm">Remember me</span>
        </label>
        <a href="#" class="text-sm text-primary">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%;" id="login-btn">
        Sign In
      </button>
    </form>

    <div class="mt-4 text-center">
      <p class="text-sm text-muted">Demo Credentials:</p>
      <div class="grid gap-1 mt-2">
        <button class="btn btn-ghost btn-sm" onclick="fillDemo('admin')">
          Admin: admin@resort.com
        </button>
        <button class="btn btn-ghost btn-sm" onclick="fillDemo('manager')">
          Manager: manager@resort.com
        </button>
        <button class="btn btn-ghost btn-sm" onclick="fillDemo('employee')">
          Employee: staff@resort.com
        </button>
      </div>
    </div>

    <div class="mt-4 pt-4" style="border-top: 1px solid var(--border);">
      <a href="../index.html" class="flex items-center justify-center gap-2 text-muted text-sm">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Back to Home
      </a>
    </div>
  </div>

  <script>
    function fillDemo(role) {
      const emails = {
        admin: 'admin@resort.com',
        manager: 'manager@resort.com',
        employee: 'staff@resort.com'
      };
      document.getElementById('email').value = emails[role];
      document.getElementById('password').value = 'demo123';
      document.getElementById('role').value = role;
    }

    function handleLogin(event) {
      event.preventDefault();
      
      const btn = document.getElementById('login-btn');
      const role = document.getElementById('role').value;
      
      btn.innerHTML = '<span class="animate-pulse">Signing in...</span>';
      btn.disabled = true;
      
      setTimeout(() => {
        // Redirect based on role
        switch(role) {
          case 'admin':
          case 'manager':
            window.location.href = '../manager/index.html';
            break;
          case 'employee':
            window.location.href = 'dashboard.html';
            break;
          default:
            btn.innerHTML = 'Sign In';
            btn.disabled = false;
            alert('Please select a role');
        }
      }, 1500);
    }
  </script>
</body>
</html>
